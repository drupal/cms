type: drupal11
docroot: web
ddev_version_constraint: '>= 1.25.0'
hooks:
  post-start:
    # If dependencies have not been installed yet, ensure the document root used by
    # Composer, AGENTS.md, and `.gitignore` matches DDEV's configuration.
    - exec: |
        if [ ! -f composer.lock ]; then
          FLAGS=(--in-place --regexp-extended)

          sed "${FLAGS[@]}" "s|([^[:alnum:]])web/|\1$DDEV_DOCROOT/|g" AGENTS.md composer.json

          if [ "$DDEV_DOCROOT" = "." ]; then
            sed "${FLAGS[@]}" "s|^/web/|/|g" .gitignore
            test -d web && mv web/* .
          else
            sed "${FLAGS[@]}" "s|^/web/|/$DDEV_DOCROOT/|g" .gitignore
            test -d web && mv web $DDEV_DOCROOT
          fi
        fi
    # Generate a hash salt in .env for Docker Compose.
    - exec: test -f .env || echo "DRUPAL_HASH_SALT=$(openssl rand -hex 32)" > .env
    - composer: install
    - composer: drupal:recipe-unpack
